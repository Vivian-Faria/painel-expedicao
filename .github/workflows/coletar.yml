name: Coletar Saude Operacional

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r painel-op/github-repo/requirements.txt
          playwright install chromium --with-deps

      - name: Executar coleta
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python painel-op/github-repo/saude_operacional.py

      - name: Upload screenshots debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatpro-screenshots
          path: "*.png"
          if-no-files-found: ignore
